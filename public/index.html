<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistema de Votação</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="voting-container">
    <header class="voting-header">
      <h1>🗳️ Sistema de Votação</h1>
      <p>Escolha suas categorias favoritas!</p>
    </header>

    <main class="voting-main">
      <div id="categoriesContainer" class="categories-grid">
        <!-- Categorias serão carregadas aqui -->
      </div>

      <div id="emptyState" class="empty-state" style="display:none;">
        <p>😴 Nenhuma votação ativa no momento</p>
      </div>
    </main>
  </div>

  <!-- Modal de Votação -->
  <div id="votingModal" class="modal" style="display:none;">
    <div class="modal-content voting-modal">
      <span class="close" onclick="closeVotingModal()">&times;</span>
      <h2 id="categoryTitle"></h2>
      <div id="votingOptions" class="voting-options"></div>
      <div class="voting-status" id="votingStatus"></div>
    </div>
  </div>

  <!-- Modal de Resultados -->
  <div id="resultsModal" class="modal" style="display:none;">
    <div class="modal-content results-modal">
      <span class="close" onclick="closeResultsModal()">&times;</span>
      <h2 id="resultsTitle"></h2>
      <div class="results-stats" id="resultStats"></div>
      <div id="resultsList" class="results-list"></div>
    </div>
  </div>

  <script src="/js/votacao.js"></script>
</body>
</html>
